<svg width="80" height="100" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Diagonal motion streaks -->
  <line x1="20" y1="10" x2="15" y2="50" stroke="url(#streakGradient1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="5" x2="30" y2="55" stroke="url(#streakGradient2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="8" x2="45" y2="52" stroke="url(#streakGradient3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="12" x2="60" y2="58" stroke="url(#streakGradient4)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shorter accent streaks -->
  <line x1="25" y1="65" x2="22" y2="85" stroke="url(#streakGradient5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="68" x2="52" y2="88" stroke="url(#streakGradient6)" stroke-width="1.5" stroke-linecap="round"/>

  <defs>
    <linearGradient id="streakGradient1" x1="20" y1="10" x2="15" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe" opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" opacity="0.6"/>
    </linearGradient>
    <linearGradient id="streakGradient2" x1="35" y1="5" x2="30" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f9ff" opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" opacity="0.7"/>
    </linearGradient>
    <linearGradient id="streakGradient3" x1="50" y1="8" x2="45" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe" opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" opacity="0.65"/>
    </linearGradient>
    <linearGradient id="streakGradient4" x1="65" y1="12" x2="60" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dbeafe" opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" opacity="0.5"/>
    </linearGradient>
    <linearGradient id="streakGradient5" x1="25" y1="65" x2="22" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe" opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" opacity="0.5"/>
    </linearGradient>
    <linearGradient id="streakGradient6" x1="55" y1="68" x2="52" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dbeafe" opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" opacity="0.5"/>
    </linearGradient>
  </defs>
</svg>
